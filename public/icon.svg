<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161c28" />
      <stop offset="50%" stop-color="#0f131c" />
      <stop offset="100%" stop-color="#090c12" />
    </linearGradient>
    <radialGradient id="emeraldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.40" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <filter id="cardShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.80"/>
    </filter>
    <clipPath id="cardInnerClip">
      <rect width="176" height="268" x="8" y="8" rx="22" />
    </clipPath>
  </defs>

  <!-- Base App Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Soft Emerald Glow Behind Card -->
  <ellipse cx="256" cy="256" rx="155" ry="185" fill="url(#emeraldGlow)"/>

  <!-- Exact Main Screen Green Uno Card #1 (Safe-Zone Centered: 192x284) -->
  <g transform="translate(256, 256) rotate(-4) translate(-96, -142)" filter="url(#cardShadow)">
    <!-- White Outer Frame -->
    <rect width="192" height="284" rx="28" fill="#ffffff" />
    <!-- Green Inner Body (#009e49 matching .uno-bg-green) -->
    <g clip-path="url(#cardInnerClip)">
      <rect width="176" height="268" x="8" y="8" rx="22" fill="#009e49"/>
      <!-- Tilted White Oval matching .uno-center-oval (width 84%, height 74%, rotate +26deg) -->
      <ellipse cx="96" cy="142" rx="74" ry="99" fill="#ffffff" transform="rotate(26 96 142)"/>
    </g>
    <!-- Corner Top-Left 1 -->
    <text x="24" y="42" font-family="'Fredoka', 'Arial Black', sans-serif" font-size="26" font-weight="900" fill="#ffffff">1</text>
    <!-- Corner Bottom-Right 1 -->
    <g transform="translate(168, 242) rotate(180)">
      <text x="0" y="0" font-family="'Fredoka', 'Arial Black', sans-serif" font-size="26" font-weight="900" fill="#ffffff">1</text>
    </g>
    <!-- Center Bold Number 1 (#15803d matching UnoCard.tsx) -->
    <text x="96" y="176" font-family="'Fredoka', 'Arial Black', sans-serif" font-size="102" font-weight="900" fill="#15803d" text-anchor="middle">1</text>
  </g>
</svg>
