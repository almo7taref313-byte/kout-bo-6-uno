<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a2232" />
      <stop offset="55%" stop-color="#111722" />
      <stop offset="100%" stop-color="#0a0d14" />
    </linearGradient>
    <linearGradient id="emeraldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <radialGradient id="greenCardGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="45%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </radialGradient>
    <radialGradient id="emeraldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.42" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Base App Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="496" height="496" x="8" y="8" rx="106" fill="none" stroke="url(#emeraldBorder)" stroke-width="10"/>

  <!-- Soft Emerald Glow Behind Card -->
  <circle cx="256" cy="256" r="195" fill="url(#emeraldGlow)"/>

  <!-- Main Screen Green Uno Card #1 -->
  <g transform="translate(256, 256) rotate(-4) translate(-115, -172)" filter="url(#cardShadow)">
    <!-- White Outer Frame -->
    <rect width="230" height="344" rx="34" fill="#ffffff" stroke="#e2e8f0" stroke-width="3"/>
    <!-- Green Inner Body -->
    <rect width="208" height="322" x="11" y="11" rx="26" fill="url(#greenCardGrad)"/>
    <!-- Tilted Center White Oval -->
    <ellipse cx="115" cy="172" rx="86" ry="58" fill="#ffffff" transform="rotate(-28 115 172)"/>
    <!-- Corner Top-Left 1 -->
    <text x="32" y="54" font-family="'Fredoka', 'Arial Black', sans-serif" font-size="36" font-weight="900" fill="#ffffff">1</text>
    <!-- Corner Bottom-Right 1 -->
    <g transform="translate(198, 290) rotate(180)">
      <text x="0" y="0" font-family="'Fredoka', 'Arial Black', sans-serif" font-size="36" font-weight="900" fill="#ffffff">1</text>
    </g>
    <!-- Center Bold Number 1 -->
    <text x="115" y="212" font-family="'Fredoka', 'Arial Black', sans-serif" font-size="122" font-weight="900" fill="#15803d" text-anchor="middle">1</text>
  </g>
</svg>
